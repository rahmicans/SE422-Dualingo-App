<link rel="stylesheet" href="/static/stil.css">
<script>
  // Sayfa çizilmeden önce kayıtlı temayı uygula (yanıp sönmeyi önler)
  try {
    var t = (JSON.parse(localStorage.getItem("se422-ders-v1") || "{}").tema) || "sistem";
    if (t !== "sistem") document.documentElement.dataset.theme = t === "koyu" ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
<div class="uygulama">
  <nav class="yan-menu" id="yan-menu"></nav>
  <main class="orta">
    <div class="mobil-ust" id="mobil-ust"></div>
    <div id="sayfa"></div>
  </main>
  <aside class="sag-panel" id="sag-panel"></aside>
</div>
<nav class="alt-menu" id="alt-menu"></nav>

<div id="ders-katman"></div>

<aside class="terminal" id="terminal" aria-label="Python terminali">
  <div class="terminal-ust">
    <span><span class="nokta"></span>Python + NumPy terminali</span>
    <div>
      <button id="terminal-temizle">Temizle</button>
      <button id="terminal-sifirla">Sıfırla</button>
      <button id="terminal-kapat" aria-label="Kapat">✕</button>
    </div>
  </div>
  <div class="terminal-ekran" id="terminal-ekran"><div class="t-bilgi">Python terminali · NumPy hazır (np olarak yüklü). Değişkenler komutlar arasında korunur.
Enter: çalıştır · ↑/↓: önceki komutlar · ":" ile biten satır blok başlatır, boş satır bitirir.</div></div>
  <div class="terminal-girdi">
    <span id="terminal-istem">&gt;&gt;&gt;</span>
    <input id="terminal-input" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="np.arange(5)">
  </div>
</aside>
